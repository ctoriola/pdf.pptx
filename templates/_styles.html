<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Bento layout: light grey page, white / black / mint / deep-green rounded cards, tight grotesk type */
:root {
  color-scheme: light;
  --page: #ececec;
  --surface: #ffffff;
  --tile: #efefef;
  --tile-line: #e2e2e2;
  --ink: #0c0c0c;
  --body: #3d3d3d;
  --muted: #7a7a7a;
  --on-dark: #ffffff;
  --on-dark-muted: #9a9a9a;
  --mint: #6fe7a2;
  --mint-ink: #0b2a17;
  --forest: #1f4a2e;
  --on-forest: #dff5e6;
  --error: #b3261e;
  --r-lg: 28px;
  --r-md: 20px;
  --r-sm: 14px;
  --gap: 14px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--page);
  color: var(--body);
  font: 15px/1.45 "Inter Tight", "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
  letter-spacing: -0.005em;
}
a { color: inherit; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 20px 20px 56px; }

/* ---- top bar ---- */
.bar {
  display: flex; align-items: center; gap: 28px;
  background: var(--surface); border-radius: var(--r-md); padding: 14px 22px; margin-bottom: var(--gap);
}
.brand { font-weight: 600; color: var(--ink); letter-spacing: 0.01em; text-decoration: none; font-size: 14px; }
.nav { display: flex; gap: 22px; font-size: 12px; color: var(--muted); }
.nav a { text-decoration: none; }
.nav a:hover, .nav a[aria-current] { color: var(--ink); }
.bar-end { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.pill {
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  font-size: 10.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
  border: 1px solid var(--tile-line); border-radius: 999px; padding: 5px 11px; color: var(--body);
}
.pill.dark { background: var(--ink); border-color: var(--ink); color: var(--on-dark); }
.pill.mint { background: var(--mint); border-color: var(--mint); color: var(--mint-ink); }
.pill.ghost { border-color: #4a4a4a; color: var(--on-dark-muted); }

/* ---- bento grid ---- */
.bento { display: grid; grid-template-columns: repeat(12, 1fr); gap: var(--gap); }
.card { border-radius: var(--r-lg); padding: 28px; background: var(--surface); min-width: 0; }
.card.black { background: var(--ink); color: var(--on-dark-muted); }
.card.mint { background: var(--mint); color: var(--mint-ink); }
.card.forest { background: var(--forest); color: var(--on-forest); }
.card.tile { background: var(--tile); }
/* a grey tile only reads on a white card; directly on the grey page it is white instead */
main.bento > .card.tile, main.bento > .stack .card.tile { background: var(--surface); }
.span-12 { grid-column: span 12; } .span-8 { grid-column: span 8; } .span-7 { grid-column: span 7; }
.span-6 { grid-column: span 6; } .span-5 { grid-column: span 5; } .span-4 { grid-column: span 4; }
.stack { display: grid; gap: var(--gap); align-content: stretch; }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap); }

h1, h2, h3 { color: var(--ink); font-weight: 500; letter-spacing: -0.035em; line-height: 1.02; margin: 0; }
.display { font-size: clamp(40px, 6.2vw, 76px); }
.title { font-size: clamp(28px, 3.6vw, 44px); }
.card.black h1, .card.black h2, .card.black h3 { color: var(--on-dark); }
.card.mint h3, .card.mint .big { color: var(--mint-ink); }
.card.forest h3 { color: #ffffff; }
.kicker { font-size: 12px; font-weight: 600; color: var(--ink); margin: 0 0 6px; letter-spacing: 0; }
.small { font-size: 12px; line-height: 1.4; margin: 0; }
.muted { color: var(--muted); }
.big { font-size: 40px; font-weight: 500; letter-spacing: -0.04em; line-height: 1; color: var(--ink); }
.num { font-size: 12px; font-weight: 600; opacity: .8; }

/* ---- hero ---- */
.hero { position: relative; display: flex; flex-direction: column; justify-content: space-between; min-height: 330px;
        padding: 30px 34px 34px; }
.hero .lede { max-width: 46ch; margin: 18px 0 0; font-size: 14px; color: var(--on-dark-muted); }
.hero-art { position: absolute; right: 26px; top: 26px; bottom: 26px; width: 31%; display: grid;
            grid-template-columns: repeat(3, 1fr); gap: 8px; pointer-events: none; }
.hero-art span { border-radius: 16px; background: linear-gradient(160deg, #f4f4f4 0%, #bdbdbd 45%, #6c6c6c 100%); }
.hero-art span:nth-child(2) { background: radial-gradient(circle at 30% 25%, #ffffff 0 14%, #cfcfcf 15% 46%, #8a8a8a 100%); }
.hero-art span:nth-child(3) { background: repeating-linear-gradient(115deg, #e9e9e9 0 14px, #9d9d9d 14px 26px, #5d5d5d 26px 30px); }
.go {
  display: inline-grid; place-items: center; width: 46px; height: 46px; border-radius: 50%;
  background: var(--mint); color: var(--mint-ink); text-decoration: none; font-size: 20px; line-height: 1;
  border: 4px solid var(--page); flex: none;
}
.hero .go { position: absolute; left: 46%; bottom: -23px; z-index: 2; }
.go:hover { filter: brightness(1.06); }

/* ---- form ---- */
.field-label { display: block; font-size: 12px; font-weight: 600; color: var(--ink); margin: 0 0 10px; }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
legend { padding: 0; }
.drop {
  position: relative; display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; height: 100%;
  min-height: 300px; border-radius: var(--r-md); padding: 24px; cursor: pointer;
  background: var(--ink); color: var(--on-dark-muted); transition: background .15s, outline-color .15s;
  outline: 2px dashed transparent; outline-offset: -10px;
}
.drop:hover, .drop.over, .drop:focus-within { outline-color: var(--mint); }
.drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.drop .plus {
  position: absolute; top: 22px; left: 24px; width: 54px; height: 54px; border-radius: 50%;
  background: var(--mint); color: var(--mint-ink); display: grid; place-items: center; font-size: 28px; font-weight: 400;
}
.drop .pill { position: absolute; top: 34px; right: 24px; }
.drop-title { color: var(--on-dark); font-size: 26px; font-weight: 500; letter-spacing: -0.03em; line-height: 1.08;
              word-break: break-word; }
.hint { font-size: 12px; color: var(--muted); margin: 0; }
.drop .hint { color: var(--on-dark-muted); }

.modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding-top: 6px; }
.mode {
  position: relative; display: flex; flex-direction: column; gap: 8px; min-height: 148px;
  background: var(--tile); border-radius: var(--r-sm); padding: 16px; cursor: pointer;
  transition: background .15s, color .15s, transform .18s ease, box-shadow .18s ease;
}
.mode input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.mode:hover { background: #e6e6e6; }
/* the chosen type lifts off the row, so it is clear at a glance which one is selected */
.mode:has(input:checked) {
  background: var(--mint); color: var(--mint-ink);
  transform: translateY(-6px);
  box-shadow: 0 14px 26px -10px rgba(11, 42, 23, .45), 0 3px 8px rgba(11, 42, 23, .12);
}
@media (prefers-reduced-motion: reduce) { .mode { transition: background .15s, color .15s; } }
.mode:has(input:focus-visible) { outline: 2px solid var(--ink); outline-offset: 2px; }
.mode.disabled { opacity: .55; cursor: not-allowed; }
.mode-body { display: flex; flex-direction: column; gap: 8px; height: 100%; }
.mode-title { display: flex; align-items: center; justify-content: space-between; gap: 8px;
              color: var(--ink); font-size: 17px; font-weight: 500; letter-spacing: -0.02em; }
.mode-desc { font-size: 12px; line-height: 1.4; color: inherit; margin-top: auto; }
.mode-desc.warn { color: var(--error); margin-top: 0; }
.tag { font-size: 9.5px; font-weight: 600; letter-spacing: .08em; background: var(--ink); color: #fff;
       border-radius: 999px; padding: 3px 8px; }

.row { display: grid; grid-template-columns: 180px 1fr; gap: 10px; margin-top: 18px; }
.field { display: flex; flex-direction: column; min-width: 0; }
.field > span { font-size: 12px; font-weight: 600; color: var(--ink); margin-bottom: 8px; }
.field em { font-style: normal; font-weight: 400; color: var(--muted); }
select, input[type=text], input[type=password] {
  font: inherit; color: var(--ink); background: var(--tile); border: 1px solid transparent;
  border-radius: 12px; padding: 12px 14px; width: 100%; min-width: 0;
}
select:focus, input[type=text]:focus, input[type=password]:focus { outline: none; border-color: var(--ink); background: #fff; }
::placeholder { color: #a0a0a0; }

button, .button {
  font: inherit; font-weight: 500; cursor: pointer; text-decoration: none; border: 0;
  display: inline-flex; align-items: center; justify-content: center; gap: 12px;
  background: var(--ink); color: var(--on-dark); border-radius: 999px; padding: 14px 22px; letter-spacing: -0.01em;
}
button:hover, .button:hover { background: #262626; }
button:disabled { opacity: .6; cursor: progress; }
.submit { width: 100%; justify-content: space-between; margin-top: 18px; padding: 8px 8px 8px 24px; font-size: 16px; }
.submit .go { border: 0; width: 42px; height: 42px; }
.button.mint { background: var(--mint); color: var(--mint-ink); }
.button.mint:hover { background: #7ff0b0; }
.button.secondary { background: transparent; color: var(--on-dark); box-shadow: inset 0 0 0 1px #4a4a4a; }
.button.secondary:hover { background: #1c1c1c; }
.link { background: none; color: var(--on-dark-muted); padding: 0; border-radius: 0; text-decoration: underline;
        text-underline-offset: 3px; font-size: 13px; }
.link:hover { background: none; color: var(--on-dark); }

/* ---- progress ---- */
#progress { min-height: 300px; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; position: relative; }
#progress[hidden] { display: none; }
#message { color: var(--on-dark); font-size: clamp(24px, 3vw, 36px); font-weight: 500; letter-spacing: -0.03em;
           line-height: 1.08; margin: 0; max-width: 24ch; }
#message.error { color: #ff9c94; }
#progress .hint { color: var(--on-dark-muted); font-size: 13px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
.spinner { position: absolute; top: 28px; left: 28px; width: 46px; height: 46px; border-radius: 50%;
           border: 4px solid #2c2c2c; border-top-color: var(--mint); animation: spin .9s linear infinite; }
.spinner[hidden] { display: none; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }

/* ---- section picker ---- */
.picker-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 18px; flex-wrap: wrap; margin-bottom: 20px; }
.picker-tools { display: flex; gap: 8px; }
.chip-btn { background: var(--tile); color: var(--ink); padding: 9px 16px; font-size: 13px; }
.chip-btn:hover { background: #e2e2e2; }
.sections { display: grid; gap: 8px; }
.sec {
  display: grid; grid-template-columns: 26px 1fr auto; align-items: center; gap: 14px;
  background: var(--tile); border-radius: var(--r-sm); padding: 14px 16px; cursor: pointer;
  transition: background .15s, opacity .15s;
}
.sec:hover { background: #e7e7e7; }
.sec input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.tick {
  width: 24px; height: 24px; border-radius: 8px; background: #fff; box-shadow: inset 0 0 0 1.5px #c9c9c9;
  display: grid; place-items: center; transition: background .15s, box-shadow .15s;
}
.sec input:checked + .tick { background: var(--mint); box-shadow: none; }
.sec input:checked + .tick::after { content: "✓"; color: var(--mint-ink); font-size: 14px; font-weight: 700; }
.sec input:indeterminate + .tick { background: var(--mint); box-shadow: none; }
.sec input:indeterminate + .tick::after { content: "–"; color: var(--mint-ink); font-size: 16px; font-weight: 700; }
.sec input:focus-visible + .tick { outline: 2px solid var(--ink); outline-offset: 2px; }
.sec-main { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.sec-title { color: var(--ink); font-size: 15px; font-weight: 500; letter-spacing: -0.01em; }
.sec-preview { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sec-meta { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.chip { font-size: 11px; font-weight: 600; color: var(--body); background: #fff; border-radius: 999px; padding: 4px 10px; white-space: nowrap; }
.sec.off { opacity: .5; }
.sec.off .tick { background: #fff; }
.chap { border-radius: var(--r-md); background: var(--tile); }
.chap.off { opacity: .55; }
.chap-head { list-style: none; display: flex; align-items: center; gap: 4px; padding-right: 14px; cursor: pointer; }
.chap-head::-webkit-details-marker { display: none; }
.chap-label { flex: 1; background: transparent; }
.chap-label:hover { background: transparent; }
.chap-kicker { font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.chap-label .sec-title { font-size: 17px; }
.caret { width: 30px; height: 30px; border-radius: 50%; background: #fff; display: grid; place-items: center; flex: none; }
.caret::after { content: "▾"; font-size: 13px; color: var(--ink); transition: transform .15s; }
.chap[open] .caret::after { transform: rotate(180deg); }
.chap-body { display: grid; gap: 6px; padding: 0 10px 10px 40px; }
.chap-body .sec { background: #fff; }
.chap-body .sec:hover { background: #fafafa; }
.chap-body .chip { background: var(--tile); }
.picker-foot { display: flex; align-items: center; gap: 16px; margin-top: 20px; flex-wrap: wrap; }
.picker-foot .total { margin-left: auto; color: var(--ink); font-weight: 500; font-size: 14px; }
.build { width: auto; margin: 0; min-width: 220px; }
.link.dark { color: var(--muted); }
.link.dark:hover { color: var(--ink); }

/* ---- small cards ---- */
.step { display: flex; flex-direction: column; justify-content: space-between; min-height: 150px; gap: 18px; padding: 22px; }
.step h3 { font-size: 20px; letter-spacing: -0.025em; line-height: 1.1; }
.foot { margin-top: var(--gap); display: flex; justify-content: space-between; gap: 16px; font-size: 11.5px; color: var(--muted); padding: 0 6px; }

/* ---- checklist and result panels ---- */
.checks { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.checks li { display: flex; align-items: center; gap: 10px; background: var(--tile); border-radius: 12px; padding: 10px 14px;
             font-size: 13px; color: var(--ink); }
.dot { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 600; flex: none; }
.dot.ok { background: var(--mint); color: var(--mint-ink); }
.dot.bad { background: #ffd9d5; color: var(--error); }
code { font: 12.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.form-grid { display: grid; gap: 14px; }
.result { border-radius: var(--r-md); padding: 22px; }
.result.error { background: #ffe3e0; color: var(--error); }
.ok { color: #14803f; font-weight: 600; }
.bad { color: var(--error); font-weight: 600; }
.warn { color: var(--error); }

@media (max-width: 900px) {
  .span-8, .span-7, .span-6, .span-5, .span-4 { grid-column: span 12; }
  .hero-art { display: none; }
  .hero { min-height: 260px; }
  .drop { min-height: 220px; }
  .nav { display: none; }
}
@media (max-width: 700px) {
  /* phones: title, then straight to the converter */
  .extras { display: none; }
  .hero { min-height: 0; gap: 22px; }
}
@media (max-width: 560px) {
  .sec { grid-template-columns: 26px 1fr; }
  .sec-meta { grid-column: 2; justify-content: flex-start; }
  .chap-body { padding-left: 10px; }
  .picker-foot .total { margin-left: 0; width: 100%; order: -1; }
  .build { width: 100%; }
  .wrap { padding: 12px 12px 40px; }
  .card { padding: 20px; border-radius: 22px; }
  .modes { grid-template-columns: 1fr; gap: 16px; }
  .mode { min-height: 0; }
  .row { grid-template-columns: 1fr; }
  .split { grid-template-columns: 1fr 1fr; }
  .bar { padding: 12px 16px; gap: 12px; }
}
</style>
